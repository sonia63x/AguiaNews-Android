let active='Para você',all=[],loading=false,lastUpdate='';
function $(id){return document.getElementById(id)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function clean(u){u=String(u||'').trim();if(u.startsWith('//'))u='https:'+u;return /^https?:\/\//i.test(u)||u.startsWith('data:image/')?u:''}
function firstImg(s){const m=String(s||'').match(/<img[^>]+src=["']([^"']+)["']/i);return m?clean(m[1]):''}
function fallbackFor(n){const c=String(n.category||'').toLowerCase();if(c.includes('recife'))return LOCAL_IMAGES.recife;if(c.includes('pernambuco'))return LOCAL_IMAGES.pernambuco;if(c.includes('esporte'))return LOCAL_IMAGES.esportes;if(c.includes('negócio')||c.includes('econom'))return LOCAL_IMAGES.economia;if(c.includes('tecnologia')||c.includes('ciência'))return LOCAL_IMAGES.tecnologia;if(c.includes('mundo'))return LOCAL_IMAGES.mundo;if(c.includes('entreten'))return LOCAL_IMAGES.entretenimento;if(c.includes('saúde'))return LOCAL_IMAGES.saude;if(c.includes('pol'))return LOCAL_IMAGES.policia;return LOCAL_IMAGES.brasil}
function imageCandidates(n){const out=[];const add=u=>{u=clean(u);if(u&&!out.includes(u))out.push(u)};add(n.image);add(n.thumbnail);add(n.enclosure);add(n.media);add(firstImg(n.description||n.content));return out} function articleShot(n){const link=clean(n.link);return link?'https://image.thum.io/get/width/1000/crop/560/noanimate/'+encodeURI(link):''} function image(n){const candidates=imageCandidates(n),fallback=fallbackFor(n),shot=articleShot(n),remote=candidates.length?candidates[0]:'';if(remote){const proxy='https://images.weserv.nl/?url='+encodeURIComponent(remote);return `<img src="${proxy}" data-remote="${esc(remote)}" data-shot="${esc(shot)}" data-fallback="${fallback}" loading="lazy" alt="Imagem da notícia" onerror="retryImage(this)">`;}if(shot)return `<img src="${shot}" data-shot="${esc(shot)}" data-fallback="${fallback}" loading="lazy" alt="Imagem da notícia" onerror="retryImage(this)">`;return `<img src="${fallback}" loading="lazy" alt="Imagem da notícia">`;} function tryRemoteImage(img){const remote=img.dataset.remote||'';if(!remote||img.dataset.tried)return;img.dataset.tried='1';img.onerror=null;img.src=remote}
function retryImage(img){const remote=img.dataset.remote||'';const shot=img.dataset.shot||'';if(remote&&!img.dataset.direct){img.dataset.direct='1';img.onerror=()=>{if(shot&&!img.dataset.shotTried){img.dataset.shotTried='1';img.onerror=()=>{img.onerror=null;img.src=img.dataset.fallback||''};img.src=shot;return}img.onerror=null;img.src=img.dataset.fallback||''};img.src=remote;return}if(shot&&!img.dataset.shotTried){img.dataset.shotTried='1';img.onerror=()=>{img.onerror=null;img.src=img.dataset.fallback||''};img.src=shot;return}img.onerror=null;img.src=img.dataset.fallback||'';} function strip(s){const d=document.createElement('div');d.innerHTML=s||'';return d.textContent||d.innerText||''}
function format(s){const d=new Date(s);return isNaN(d)?s:d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}
function renderQuickbar(){const items=['Manchetes','Recife','Pernambuco','Brasil','Política','Economia','Esportes','Tecnologia','Salvos'];$('quickbar').innerHTML=items.map(c=>`<button class="quick-btn ${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')}
function renderNav(){const cats=['Para você','Manchetes','Recife','Pernambuco','Brasil','Mundo','Economia','Política','Tecnologia','Entretenimento','Esportes','Saúde','Salvos'];$('tabs').innerHTML=cats.map(c=>`<button class="${active===c?'active':''}" onclick="setCat('${c.replace(/'/g,"\\'")}')">${c}</button>`).join('');$('side').innerHTML='<div class="side-title">Página inicial</div>'+cats.slice(0,2).map(c=>`<button class="${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')+'<div class="sep"></div><div class="side-title">Explorar</div>'+cats.slice(2).map(c=>`<button class="${active===c?'active':''}" onclick="setCat('${c}')">${c}</button>`).join('')+'<div class="sep"></div><button class="'+(active==='Salvos'?'active':'')+'" onclick="setCat(\'Salvos\')">★ Notícias salvas</button><button onclick="refreshLive()">↻ Atualizar notícias</button>'}
function readFavorites(){try{return JSON.parse(localStorage.getItem('aguianews-favorites-v17')||'[]')}catch(e){return[]}}
function writeFavorites(v){try{localStorage.setItem('aguianews-favorites-v17',JSON.stringify(v))}catch(e){}}
function isFav(id){return readFavorites().includes(String(id))}
function toggleFavorite(id){const key=String(id),v=readFavorites(),i=v.indexOf(key);if(i>=0)v.splice(i,1);else v.unshift(key);writeFavorites(v);render(filtered())}
function latestList(list){return [...list].sort((a,b)=>new Date(b.rawDate||0)-new Date(a.rawDate||0))}
function shareArticle(id){const n=all.find(x=>encodeURIComponent(x.id)===id);if(!n)return;const url=n.link||location.href;if(navigator.share){navigator.share({title:n.title,text:n.summary,url}).catch(()=>{})}else{try{navigator.clipboard.writeText(url);alert('Link da notícia copiado.')}catch(e){}}}
function card(n){const id=encodeURIComponent(n.id),saved=isFav(n.id);return `<article class="story" role="link" tabindex="0" onclick="openArticle('${id}')" onkeydown="if(event.key==='Enter')openArticle('${id}')"><div class="thumb">${image(n)}</div><div><div class="source-row"><span class="source-dot"></span>${esc(n.source)} <span>·</span> ${esc(n.category)}</div><h3 class="story-title">${esc(n.title)}</h3><p>${esc(n.summary)}</p><div class="time">${esc(n.date)}</div></div><div class="story-actions"><button class="icon-btn ${saved?'saved':''}" aria-label="${saved?'Remover dos salvos':'Salvar notícia'}" onclick="event.stopPropagation();toggleFavorite('${esc(n.id)}')">${saved?'★':'☆'}</button></div></article>`}
let carouselTimer=null,carouselIndex=0,carouselTouchX=0,carouselPaused=false;
function carouselSlides(list){return list.slice(0,5).map((n,i)=>`<article class="carousel-slide" data-i="${i}" onclick="openArticle('${encodeURIComponent(n.id)}')"><div class="carousel-media">${image(n)}</div><div class="carousel-overlay"></div><div class="carousel-copy"><div class="carousel-kicker">${esc(n.category||'Destaque')} · ${esc(n.source)}</div><h2>${esc(n.title)}</h2><p>${esc(n.summary)}</p></div></article>`).join('')}
function carouselMarkup(list){const top=list.slice(0,5);if(!top.length)return '';return `<div class="featured-wrap"><div class="featured-label">Destaques</div><section class="featured-carousel" id="featuredCarousel" aria-label="Notícias em destaque"><div class="carousel-track" id="carouselTrack">${carouselSlides(top)}</div><button class="carousel-arrow prev" aria-label="Notícia anterior" onclick="event.stopPropagation();carouselMove(-1)">‹</button><button class="carousel-arrow next" aria-label="Próxima notícia" onclick="event.stopPropagation();carouselMove(1)">›</button><div class="carousel-dots">${top.map((_,i)=>`<button class="carousel-dot ${i===0?'active':''}" aria-label="Ir para destaque ${i+1}" onclick="event.stopPropagation();carouselGo(${i})"></button>`).join('')}</div><div class="carousel-progress" id="carouselProgress"></div></section></div>`}
function setupCarousel(){clearInterval(carouselTimer);const el=$('featuredCarousel');if(!el)return;carouselIndex=0;carouselPaused=false;const track=$('carouselTrack');el.addEventListener('mouseenter',()=>carouselPaused=true);el.addEventListener('mouseleave',()=>carouselPaused=false);el.addEventListener('touchstart',e=>{carouselTouchX=e.changedTouches[0].clientX;carouselPaused=true},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-carouselTouchX;if(Math.abs(dx)>45)carouselMove(dx<0?1:-1);carouselPaused=false},{passive:true});carouselTimer=setInterval(()=>{if(!carouselPaused)carouselMove(1)},6000);carouselGo(0)}
function carouselGo(i){const track=$('carouselTrack');if(!track)return;const total=track.children.length;carouselIndex=(i+total)%total;track.style.transform=`translateX(-${carouselIndex*100}%)`;document.querySelectorAll('.carousel-dot').forEach((d,k)=>d.classList.toggle('active',k===carouselIndex));const bar=$('carouselProgress');if(bar){bar.style.transition='none';bar.style.width='0';requestAnimationFrame(()=>{bar.style.transition='width 6s linear';bar.style.width='100%'})}}
function carouselMove(delta){carouselGo(carouselIndex+delta)}
function renderLoadingState(){clearInterval(carouselTimer);const label=active==='Para você'?'notícias':active==='Manchetes'?'manchetes':active==='Salvos'?'notícias salvas':active;const search=String(($('q')&&$('q').value)||'').trim();$('app').innerHTML=`<section class="loading-state"><div class="loading-head"><span class="loading-spinner" aria-hidden="true"></span><h2>Atualizando ${esc(label)}</h2></div><p class="loading-sub">Estamos buscando as notícias mais recentes. Enquanto isso, o conteúdo está sendo preparado.</p><div class="skeleton-list">${[1,2,3,4].map(()=>'<div class="skeleton-card"><div class="skeleton-media"></div><div><div class="skeleton-line short"></div><div class="skeleton-line long"></div><div class="skeleton-line"></div></div></div>').join('')}</div>${search?`<div class="offline-note">Pesquisando por “${esc(search)}”...</div>`:''}</section>`}
function render(list){clearInterval(carouselTimer);if(!list.length){if(loading){renderLoadingState();return}$('app').innerHTML=active==='Salvos'?'<div class="empty-fav"><div style="font-size:34px">★</div><b>Nenhuma notícia salva</b><br><small>Toque na estrela de uma notícia para guardá-la aqui.</small></div>':'<div class="message"><b>Nenhuma notícia encontrada.</b><br><small>Tente outra categoria ou termo de busca.</small></div>';return}const hero=list[0],rest=list.slice(1),q=String(($('q')&&$('q').value)||'').trim();let html='';if(q)html+=`<div class="search-result-note">${list.length} resultado(s) para “${esc(q)}”</div>`;if(!q&&active!=='Salvos')html+=carouselMarkup(list);html+=`<div class="latest-strip"><span class="latest-dot"></span><b>${active==='Salvos'?'Notícias salvas':active==='Para você'?'Últimas notícias':esc(active)}</b><span>·</span><span>${lastUpdate?'Atualizado '+esc(lastUpdate):'disponível agora'}</span></div>`;html+=`<section class="cluster"><div class="lead"><div class="lead-img">${image(hero)}</div><div class="lead-info"><div class="source-badge">${esc(hero.source)} · ${esc(hero.category)}</div><h1>${esc(hero.title)}</h1><p>${esc(hero.summary)}</p><div class="time">${esc(hero.date)}</div><div class="article-actions"><button class="quick-btn" onclick="openArticle('${encodeURIComponent(hero.id)}')">Ler notícia →</button><button class="quick-btn" onclick="toggleFavorite('${esc(hero.id)}')">${isFav(hero.id)?'★ Salva':'☆ Salvar'}</button></div></div></div>`;if(rest.length)html+='<div class="perspectives">'+rest.slice(0,8).map(card).join('')+'</div>';html+='</section>';if(rest.length>8)html+=`<div class="section-head"><h2>Mais notícias</h2></div><section class="cluster"><div class="perspectives">${rest.slice(8).map(card).join('')}</div></section>`;$('app').innerHTML=html;setupCarousel()}
function dedupe(items){const seen=new Set();return items.filter(n=>{const k=String(n.title||'').toLowerCase().trim();if(!k||seen.has(k))return false;seen.add(k);return true}).sort((a,b)=>new Date(b.rawDate)-new Date(a.rawDate))}
function filtered(){const q=String(($('q')&&$('q').value)||'').trim().toLowerCase();let list=all;if(active==='Salvos'){const fav=new Set(readFavorites());list=list.filter(n=>fav.has(String(n.id)))}else if(active!=='Para você'&&active!=='Manchetes')list=list.filter(n=>n.category===active);if(q)list=list.filter(n=>(n.title+' '+n.summary+' '+n.source+' '+n.category).toLowerCase().includes(q));return q?latestList(list):list}
function readCache(){try{const raw=localStorage.getItem('aguianews-cache-v19');return raw?JSON.parse(raw):null}catch(e){return null}}
function writeCache(v){try{localStorage.setItem('aguianews-cache-v19',JSON.stringify(v))}catch(e){}}
function parseRSS(xml,f){const doc=new DOMParser().parseFromString(xml,'text/xml'),nodes=[...doc.querySelectorAll('item')];if(!nodes.length)throw Error('RSS sem itens');const txt=(el,sel)=>{const x=el.querySelector(sel);return x?(x.textContent||'').trim():''};const attr=(el,sel,a)=>{const x=el.querySelector(sel);return x?x.getAttribute(a)||'':''};return nodes.map(x=>{const description=txt(x,'description'),content=txt(x,'content\\:encoded')||txt(x,'content'),media=attr(x,'media\\:content','url')||attr(x,'media\\:thumbnail','url'),enclosure=attr(x,'enclosure','url'),link=txt(x,'link'),title=txt(x,'title')||'Sem título';return{id:txt(x,'guid')||link||title,title,summary:strip(description||content).slice(0,240),link,image:clean(media)||clean(enclosure)||clean(firstImg(description||content)),thumbnail:clean(media),enclosure:clean(enclosure),media:clean(media),description,content,date:format(txt(x,'pubDate')),rawDate:txt(x,'pubDate')||0,source:f.name,category:f.cat}})}
function jsonp(url,timeout=3800){return new Promise((resolve,reject)=>{const cb='eagleNewsCb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');let done=false;const finish=(fn,v)=>{if(done)return;done=true;clearTimeout(timer);try{delete window[cb]}catch(e){window[cb]=undefined}script.remove();fn(v)};const timer=setTimeout(()=>finish(reject,Error('Tempo limite')),timeout);window[cb]=d=>finish(resolve,d);script.onerror=()=>finish(reject,Error('Fonte indisponível'));script.src=url+'&callback='+cb;document.head.appendChild(script)})}
function mapApiItems(d,f){if(!d||d.status!=='ok'||!Array.isArray(d.items))throw Error('Resposta inválida');return d.items.map(x=>({id:x.guid||x.link||x.title,title:x.title||'Sem título',summary:strip(x.description||x.content||'').slice(0,240),link:x.link,image:clean(x.thumbnail)||clean(x.enclosure)||clean(x.media)||clean(firstImg(x.description||x.content)),thumbnail:clean(x.thumbnail),enclosure:x.enclosure,media:x.media,description:x.description||'',content:x.content||'',date:format(x.pubDate),rawDate:x.pubDate||0,source:x.author||d.feed?.title||f.name,category:f.cat}))}
async function fetchText(url,timeout=3800){const ctl=new AbortController(),timer=setTimeout(()=>ctl.abort(),timeout);try{const r=await fetch(url,{method:'GET',cache:'no-store',signal:ctl.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}finally{clearTimeout(timer)}}
async function feedViaAllOrigins(f){const rss='https://news.google.com/rss/search?q='+encodeURIComponent(f.q)+'&hl=pt-BR&gl=BR&ceid=BR%3Apt-419',url='https://api.allorigins.win/raw?url='+encodeURIComponent(rss);return parseRSS(await fetchText(url,3800),f)}
async function feedViaRss2Json(f){const rss='https://news.google.com/rss/search?q='+encodeURIComponent(f.q)+'&hl=pt-BR&gl=BR&ceid=BR%3Apt-419',url='https://api.rss2json.com/v1/api.json?rss_url='+encodeURIComponent(rss);return mapApiItems(await jsonp(url,6500),f)}
async function feed(f){const jobs=[feedViaAllOrigins(f),feedViaRss2Json(f)];try{return await Promise.any(jobs.map(p=>p.then(x=>{if(!x?.length)throw Error('Sem notícias');return x})))}catch(e){return []}}
async function refreshLive(){if(loading)return;loading=true;const fs=(active==='Para você'||active==='Manchetes')?FEEDS:FEEDS.filter(f=>f.cat===active);const results=await Promise.allSettled(fs.map(f=>feed(f)));const fresh=dedupe(results.flatMap(x=>x.status==='fulfilled'?(x.value||[]):[]));if(fresh.length){all=fresh;lastUpdate=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});writeCache({time:Date.now(),items:all});render(filtered())}else{lastUpdate='sem conexão';if(!filtered().length)renderLoadingState()}loading=false}
function load(){if(loading)return;const cache=readCache();all=cache?.items?.length?cache.items:STARTER_NEWS;all=dedupe(all);lastUpdate=cache?.items?.length?'cache local':'aguardando atualização';renderNav();renderQuickbar();const current=filtered();if(current.length)render(current);else{loading=true;renderLoadingState();loading=false}setTimeout(refreshLive,40)}
function setCat(c){active=c;renderNav();renderQuickbar();load()}
function goHome(){active='Para você';$('q').value='';renderNav();renderQuickbar();load()}
function openArticle(id){const n=all.find(x=>encodeURIComponent(x.id)===id);if(!n)return;const saved=isFav(n.id);$('app').innerHTML=`<article class="article-page"><button class="article-back" onclick="render(filtered())">← Voltar às notícias</button><div class="article-meta" style="margin-top:16px"><span class="source-badge">${esc(n.category)}</span><span>${esc(n.source)}</span><span>·</span><span>${esc(n.date)}</span></div><h1>${esc(n.title)}</h1><div class="article-image">${image(n)}</div><p class="article-summary">${esc(n.summary)}</p><div class="article-actions"><button class="quick-btn" onclick="toggleFavorite('${esc(n.id)}')">${saved?'★ Remover dos salvos':'☆ Salvar notícia'}</button><button class="quick-btn" onclick="shareArticle('${encodeURIComponent(n.id)}')">↗ Compartilhar</button><a class="quick-btn" target="_blank" rel="noopener" href="${esc(n.link||'#')}">Ler matéria original ↗</a></div><div class="offline-note">Fonte: <b>${esc(n.source)}</b>. O ÁguiaNews exibe o resumo e direciona para a publicação original.</div></article>`}
function applyTheme(){let saved='';try{saved=localStorage.getItem('aguianews-theme')||''}catch(e){}const dark=saved?saved==='dark':true;document.documentElement.classList.toggle('dark',dark);document.querySelector('meta[name=theme-color]').setAttribute('content',dark?'#0b0f14':'#ffffff');$('themeBtn').innerHTML=dark?'☀️':'🌙';$('themeBtn').title=dark?'Tema claro':'Tema escuro'}
function toggleTheme(){const dark=document.documentElement.classList.contains('dark');try{localStorage.setItem('aguianews-theme',dark?'light':'dark')}catch(e){}applyTheme()}
applyTheme();$('q').addEventListener('input',()=>render(filtered()));renderNav();renderQuickbar();load();setInterval(()=>{if(!loading)refreshLive()},300000);
